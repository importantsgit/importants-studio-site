<style>
:root{--bg:#faf9f6;--card:#ffffff;--ink:#1a1a17;--mut:#6f6d66;--line:#e6e3da;--chip:#f0eee7}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--ink)}
.wrap{padding:0 20px 72px}
.col{max-width:680px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--ink)}
.logo{font-size:17px;font-weight:800;letter-spacing:-0.01em;text-decoration:none}
.logo span{color:var(--mut)}
.nav{display:inline-block;border:1px solid var(--ink);font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;white-space:nowrap;text-decoration:none}
.nav:hover{background:var(--ink);color:var(--bg)}
article{padding:36px 0 0}
h1{font-size:clamp(23px,4.6vw,31px);font-weight:800;line-height:1.42;margin:0 0 14px;letter-spacing:-0.02em;text-wrap:pretty}
.meta{display:flex;gap:10px;font-size:13px;color:var(--mut);padding-bottom:22px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.body{padding-top:26px;font-size:16px;line-height:1.85}
.body p{margin:0 0 20px}
.body h2{font-size:19px;font-weight:800;letter-spacing:-0.01em;margin:38px 0 14px;padding-top:20px;border-top:1px solid var(--line);text-wrap:pretty}
.body h3{font-size:16px;font-weight:700;margin:28px 0 10px}
.body ul,.body ol{margin:0 0 20px;padding-left:22px}
.body li{margin-bottom:9px}
.body strong{font-weight:700}
.body code{background:var(--chip);padding:2px 6px;border-radius:5px;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.body pre{background:var(--chip);padding:14px 16px;border-radius:9px;overflow-x:auto;font-size:13.5px;line-height:1.65;margin:0 0 20px}
.body pre code{background:none;padding:0}
.body blockquote{margin:0 0 20px;padding:2px 0 2px 16px;border-left:3px solid var(--line);color:var(--mut)}
.body table{border-collapse:collapse;width:100%;margin:0 0 22px;font-size:14.5px}
.body th,.body td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.body th{font-weight:700;background:var(--chip)}
.body hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.tail{margin-top:44px;padding-top:22px;border-top:1px solid var(--ink);font-size:14px;color:var(--mut);line-height:1.7}
.tail a{color:var(--mut)}
footer{padding:30px 0 0;margin-top:26px;border-top:1px solid var(--line)}
.fmeta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mut)}
.fmeta a{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap"><div class="col">

  <header>
    <a class="logo" href="/">Importants<span>.</span>Studio</a>
    <a class="nav" href="/guide/">AI 도구 목록</a>
  </header>

  <article>
    <h1><!--TITLE--></h1>
    <div class="meta"><span><!--DATE--></span><span>Importants Studio</span></div>
    <div class="body"><!--BODY--></div>
    <div class="tail"><!--TAIL--></div>
  </article>

  <footer>
    <div class="fmeta">
      <a href="/">홈</a>
      <a href="/guide/">AI 도구</a>
      <a href="/about/">소개</a>
      <a href="/contact/">문의</a>
      <a href="/privacy/">개인정보처리방침</a>
    </div>
  </footer>

</div></div>
</body>
