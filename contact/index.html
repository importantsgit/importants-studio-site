<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의 | Importants Studio</title>
<meta name="description" content="Importants Studio의 앱, 블로그 글, 광고·제휴 문의를 받습니다.">
<link rel="canonical" href="https://importants-studio.com/contact/">
<meta name="robots" content="index, follow">
<meta property="og:type" content="article">
<meta property="og:title" content="문의 | Importants Studio">
<meta property="og:url" content="https://importants-studio.com/contact/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
:root{
  --bg:#070B14; --navy:#0F172A;
  --line:#1c2740;
  --text:#E2E8F0; --dim:#94A3B8;
  --blue:#3B82F6; --blue-b:#60A5FA;
  --sans:"Pretendard Variable",Inter,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --title:"SUIT Variable","Pretendard Variable",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  word-break:keep-all; line-height:1.75;
}
a{color:var(--blue-b)}
.wrap{max-width:720px;margin:0 auto;padding:0 24px 96px}
.top{display:flex;align-items:center;justify-content:space-between;padding:26px 0}
.mark{font-family:Inter,var(--sans);font-weight:800;font-size:15px;letter-spacing:.02em;
  color:var(--text);text-decoration:none}
.mark i{font-style:normal;color:var(--blue-b)}
.top .back{font-size:13px;color:var(--dim);text-decoration:none}
.top .back:hover{color:var(--text)}

h1{font-family:var(--title);font-size:clamp(26px,5vw,38px);font-weight:800;
  letter-spacing:-.02em;line-height:1.3;margin:36px 0 8px}
.lead{color:var(--dim);margin:0 0 40px}
p{color:var(--text)}
strong{font-weight:700;color:#fff}
.mail{display:inline-block;margin:8px 0 0;padding:12px 18px;border:1px solid var(--line);
  border-radius:10px;font-weight:700;text-decoration:none}
.mail:hover{border-color:var(--blue-b)}
.meta{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);
  color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="mark" href="/">Importants<i>.</i>Studio</a>
    <a class="back" href="/">← 홈으로</a>
  </div>

  <h1>문의</h1>
  <p class="lead">Importants Studio는 블로그 여섯 개와 앱, 여러 도구를 운영합니다. 앱 사용 중 불편한 점, 블로그 글 내용, 광고·제휴 관련 문의를 받습니다.</p>

  <p>문의는 아래 주소로 보내주세요. 어느 앱인지, 어느 글인지 함께 적어주시면 내용을 확인하기 쉽습니다.</p>
  <a class="mail" href="mailto:contact@importants-studio.com">contact@importants-studio.com</a>

  <p class="meta">주민등록번호, 계좌번호 등 개인정보는 메일에 적지 말아 주세요. 개인정보 처리에 관한 안내는 <a href="/privacy/">개인정보처리방침</a>에 있습니다.</p>
</div>
</body>
</html>
