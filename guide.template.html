<style>
:root{--bg:#faf9f6;--card:#ffffff;--ink:#1a1a17;--mut:#6f6d66;--line:#e6e3da}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{padding:0 20px 72px}
.col{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--ink)}
.logo{font-size:17px;font-weight:800;letter-spacing:-0.01em}
.logo span{color:var(--mut)}
.nav{display:inline-block;border:1px solid var(--ink);font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;white-space:nowrap}
.nav:hover{background:var(--ink);color:var(--bg);text-decoration:none}
.hero{padding:36px 0 28px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(24px,5vw,34px);font-weight:800;line-height:1.4;margin:0 0 12px;letter-spacing:-0.02em;text-wrap:pretty}
.lead{color:var(--mut);font-size:15px;line-height:1.7;margin:0}
.list{padding:8px 0 0}
.item{display:block;padding:20px 0;border-bottom:1px solid var(--line)}
.item:hover{text-decoration:none;opacity:.72}
.itop{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.inum{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;flex-shrink:0}
.idate{font-size:12px;color:var(--mut);opacity:.75;font-variant-numeric:tabular-nums;margin-left:auto;flex-shrink:0}
.ititle{font-size:17px;font-weight:700;line-height:1.5;margin:0 0 6px;text-wrap:pretty}
.isum{font-size:14px;color:var(--mut);line-height:1.65;margin:0}
.group{margin:34px 0 4px;font-size:13px;font-weight:700;letter-spacing:0.04em;color:var(--mut)}
footer{padding:32px 0 0;border-top:1px solid var(--line);margin-top:28px}
.fmeta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mut)}
.fmeta a{color:var(--mut)}
</style>
