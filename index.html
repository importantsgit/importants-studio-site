<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importants Studio</title>
<meta name="description" content="블로그 여섯 개와 게임·도구를 만들고 운영합니다. 오늘 올라온 글부터 보세요.">
<link rel="canonical" href="https://importants-studio.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="Importants Studio">
<meta property="og:description" content="블로그 여섯 개와 게임·도구를 만들고 운영합니다.">
<meta property="og:url" content="https://importants-studio.com/">
<style>
:root{--bg:#faf9f6;--card:#ffffff;--ink:#1a1a17;--mut:#6f6d66;--line:#e6e3da;--chip:#f0eee7}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{padding:0 20px 72px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--ink)}
.logo{text-decoration:none;font-size:17px;font-weight:800;letter-spacing:-0.01em;color:var(--ink)}
.logo:hover{text-decoration:none}
.logo span{color:var(--mut)}
.nav{display:inline-block;border:1px solid var(--ink);color:var(--ink);font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;white-space:nowrap;text-decoration:none}
.nav:hover{background:var(--ink);color:var(--bg);text-decoration:none}
.hero{padding:36px 0 40px;border-bottom:1px solid var(--line)}
.today{font-size:12px;color:var(--mut);letter-spacing:0.12em;margin-bottom:12px}
h1{font-size:clamp(24px,5vw,34px);font-weight:800;line-height:1.4;margin:0;letter-spacing:-0.02em;word-break:keep-all;text-wrap:pretty}
.sec{padding:32px 0;border-bottom:1px solid var(--line)}
.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;text-decoration:none}
.sechead:hover{text-decoration:none}
.dot{width:12px;height:12px;flex-shrink:0;align-self:center}
.secname{font-size:19px;font-weight:800;letter-spacing:-0.01em;white-space:nowrap}
.sectag{font-size:13px;color:var(--mut);flex:1;min-width:0;word-break:keep-all}
.secmore{font-size:13px;font-weight:700;white-space:nowrap}
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 32px}
.post{display:flex;flex-direction:column;gap:5px;padding:14px 0;border-top:1px solid var(--line);text-decoration:none}
.post:hover{text-decoration:none;opacity:.75}
.ptitle{font-size:15px;font-weight:700;line-height:1.5;word-break:keep-all;text-wrap:pretty}
.psum{font-size:13px;color:var(--mut);line-height:1.6;word-break:keep-all;text-wrap:pretty}
.pdate{font-size:12px;color:var(--mut);opacity:.7;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-decoration:none;min-width:0}
.tile:hover{text-decoration:none;border-color:var(--ink)}
.tkind{font-size:11px;color:var(--mut);letter-spacing:0.06em}
.tname{font-size:14px;font-weight:700;word-break:keep-all}
footer{padding:32px 0 0;display:flex;flex-direction:column;gap:20px}
.igs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ig{display:flex;flex-direction:column;gap:2px;text-decoration:none}
.igname{font-size:13px;font-weight:700}
.ighandle{font-size:12px;color:var(--mut)}
.fmeta{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--mut)}
.fmeta a{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap"><div class="col">

  <header>
    <a class="logo" href="/">Importants<span>.</span>Studio</a>
    <a class="nav" href="/about/">About</a>
  </header>

  <div class="hero">
    <div class="today" id="today"></div>
    <h1>오늘의 최신 글부터 만나보세요.</h1>
  </div>

  <div id="blogs"></div>
  <section class="sec" id="playsec"></section>

  <footer>
    <div class="igs" id="igs"></div>
    <div class="fmeta">
      <a id="mail" href="mailto:contact@importants-studio.com">contact@importants-studio.com</a>
      <a href="/privacy/" style="white-space:nowrap">개인정보처리방침</a>
    </div>
  </footer>

</div></div>

<script>
(function () {
  "use strict";

  var PLAY_COLOR = "#6c4cf1";

  // feed.json 을 못 읽어도 어디로 가는지는 보여야 한다. 글 목록만 비운다.
  // 가짜 제목을 넣지 않는다. 안 읽힌 것보다 틀린 게 나쁘다.
  var FALLBACK = {
    blogs: [
      {name:"혜택줍줍",   color:"#0e9f6e", url:"https://blog.importants-studio.com",      tagline:"정부 지원금과 세금 환급을 매일 정리합니다",   posts:[]},
      {name:"차곡차곡",   color:"#0d8a8a", url:"https://car.importants-studio.com",       tagline:"자동차세, 보험료, 검사 기한을 챙깁니다",      posts:[]},
      {name:"홈로그",     color:"#d9527a", url:"https://home.importants-studio.com",      tagline:"결혼과 육아에 드는 돈과 제도를 정리합니다",   posts:[]},
      {name:"느긋하게",   color:"#2c4a7c", url:"https://leisurely.importants-studio.com", tagline:"연금과 건강보험, 은퇴 뒤의 살림을 정리합니다", posts:[]},
      {name:"돈의문법",   color:"#2f6fdb", url:"https://money.importants-studio.com",     tagline:"뉴스의 숫자가 무슨 뜻인지 풀어 씁니다",      posts:[]},
      {name:"여행의밑줄", color:"#e07b39", url:"https://travel.importants-studio.com",    tagline:"떠나기 전에 확인해야 할 것을 짚습니다",       posts:[]}
    ],
    play: {name:"심심풀이", tagline:"심심할 때 즐겨보세요", url:"https://simsim.importants-studio.com", items:[]},
    links: {
      instagram: [
        {name:"혜택줍줍", handle:"jupjup.money",     url:"https://www.instagram.com/jupjup.money/"},
        {name:"차곡차곡", handle:"chagok.car",       url:"https://www.instagram.com/chagok.car/"},
        {name:"홈로그",   handle:"homelog.family",   url:"https://www.instagram.com/homelog.family/"},
        {name:"느긋하게", handle:"leisurely.retire", url:"https://www.instagram.com/leisurely.retire/"}
      ],
      email: "contact@importants-studio.com"
    }
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function shortDate(v) {
    var d = new Date(v);
    if (isNaN(d)) return v || "";
    return (d.getMonth() + 1) + ". " + d.getDate() + ".";
  }

  function sectionHead(name, tagline, url, color) {
    var a = el("a", "sechead");
    a.href = url;
    var dot = el("span", "dot");
    dot.style.background = color;
    var more = el("span", "secmore", "전체 →");
    more.style.color = color;
    a.appendChild(dot);
    a.appendChild(el("span", "secname", name));
    a.appendChild(el("span", "sectag", tagline || ""));
    a.appendChild(more);
    return a;
  }

  function renderBlogs(blogs) {
    var host = document.getElementById("blogs");
    host.textContent = "";
    blogs.forEach(function (b) {
      var sec = el("section", "sec");
      sec.appendChild(sectionHead(b.name, b.tagline, b.url, b.color));
      var grid = el("div", "posts");
      (b.posts || []).slice(0, 5).forEach(function (p) {
        var a = el("a", "post");
        a.href = p.url;
        a.appendChild(el("span", "ptitle", p.title));
        if (p.summary) a.appendChild(el("span", "psum", p.summary));
        a.appendChild(el("span", "pdate", shortDate(p.date)));
        grid.appendChild(a);
      });
      sec.appendChild(grid);
      host.appendChild(sec);
    });
  }

  function renderPlay(play) {
    var sec = document.getElementById("playsec");
    sec.textContent = "";
    sec.appendChild(sectionHead(play.name, play.tagline, play.url, PLAY_COLOR));
    var grid = el("div", "tiles");
    (play.items || []).forEach(function (it) {
      var a = el("a", "tile");
      a.href = it.url;
      a.appendChild(el("span", "tkind", it.kind));
      a.appendChild(el("span", "tname", it.name));
      grid.appendChild(a);
    });
    sec.appendChild(grid);
  }

  function renderLinks(links) {
    var host = document.getElementById("igs");
    host.textContent = "";
    (links.instagram || []).forEach(function (ig) {
      var a = el("a", "ig");
      a.href = ig.url;
      a.appendChild(el("span", "igname", ig.name));
      a.appendChild(el("span", "ighandle", ig.handle));
      host.appendChild(a);
    });
    if (links.email) {
      var m = document.getElementById("mail");
      m.href = "mailto:" + links.email;
      m.textContent = links.email;
    }
  }

  function render(data) {
    renderBlogs(data.blogs || FALLBACK.blogs);
    renderPlay(data.play || FALLBACK.play);
    renderLinks(data.links || FALLBACK.links);
  }

  var d = new Date();
  document.getElementById("today").textContent =
    d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate() + ".";

  render(FALLBACK);

  fetch("/feed.json", {cache: "no-cache"})
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (j) render(j); })
    .catch(function () {});
})();
</script>
</body>
</html>
