name: feed

# 매거진 홈이 읽을 feed.json 을 만든다. 공개 RSS 만 읽으므로 시크릿이 필요 없다.
# 노트북과 무관하게 GitHub 쪽에서 돈다.
on:
  schedule:
    # GitHub 의 예약 실행은 무료 러너에서 자주 밀린다. 하루 두 번으로 잡았더니
    # 4시간 늦게 오거나 아예 건너뛰어서 매거진 홈이 하루 묵었다. 촘촘히 걸어
    # 그중 몇 번이라도 제때 돌게 한다. 빌드가 30초라 부담이 없다.
    - cron: "5 */2 * * *"
  workflow_dispatch:
  # 블로그 저장소가 글을 머지한 뒤 이 이벤트로 깨울 수 있다.
  repository_dispatch:
    types: [blog-updated]
  push:
    branches: [main]
    paths: ["scripts/build_feed.py", "index.template.html", ".github/workflows/feed.yml"]

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_feed.py feed.json
      - name: 바뀐 게 있을 때만 커밋
        run: |
          if [ -n "$(git status --porcelain feed.json index.html sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.json index.html sitemap.xml
            git commit -m "매거진 홈 갱신"
            git push
          else
            echo "변경 없음"
          fi
